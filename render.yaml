# Render Blueprint: the web app and Postgres. The watcher runs on a separate always-on server
# (see apps/worker/ecosystem.config.cjs) and reaches the database over TLS from one allowed IP.

databases:
  - name: relaymesh-db
    databaseName: relaymesh
    user: relaymesh
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    # The web app connects over Render's private network. From the internet, only the watcher's
    # server may connect, and Render requires TLS for those connections.
    ipAllowList:
      - source: 162.62.231.147/32
        description: watcher server

services:
  - type: web
    name: relaymesh-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @relaymesh/web build
    startCommand: corepack pnpm --filter @relaymesh/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: relaymesh-db
          property: connectionString
